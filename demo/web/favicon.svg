<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The demo's own motif: a ranked stack of document slips, the top result in cobalt. -->
  <rect width="64" height="64" rx="14" fill="#16191d"/>
  <g transform="rotate(-12 32 32)">
    <rect x="20" y="13" width="24" height="31" rx="2" fill="#7a3cff"/>
  </g>
  <g transform="rotate(8 32 32)">
    <rect x="21" y="16" width="24" height="31" rx="2" fill="#0f9d8a"/>
  </g>
  <rect x="19" y="18" width="26" height="33" rx="2" fill="#2e4bff"/>
  <rect x="23" y="23" width="11" height="3" rx="1" fill="#f7f8fa"/>
  <rect x="23" y="30" width="18" height="2" rx="1" fill="#f7f8fa" opacity=".8"/>
  <rect x="23" y="35" width="18" height="2" rx="1" fill="#f7f8fa" opacity=".8"/>
  <rect x="23" y="40" width="13" height="2" rx="1" fill="#f7f8fa" opacity=".8"/>
</svg>
